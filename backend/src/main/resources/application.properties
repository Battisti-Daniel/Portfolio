spring.application.name=portfolio-backend

# Banco de dados (ver docker-compose.yml na raiz do projeto)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Usuário admin criado automaticamente na primeira execução (TROQUE em producao via env vars)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# JWT (TROQUE app.jwt.secret em producao via env var JWT_SECRET)
app.jwt.secret=${JWT_SECRET:este-e-um-valor-padrao-de-desenvolvimento-troque-em-producao-para-algo-unico-e-secreto-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - origem do Angular em desenvolvimento
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.port=${PORT:${SERVER_PORT:8080}}
