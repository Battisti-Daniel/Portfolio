<header class="site-header">
  <div class="container bar">
    <a class="brand" routerLink="/" (click)="closeMenu()">{{ brandName() }}</a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav" [class.open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Início</a>
      <a routerLink="/projetos" routerLinkActive="active" (click)="closeMenu()">Projetos</a>
      <a routerLink="/planos" routerLinkActive="active" (click)="closeMenu()">Planos</a>
      <a routerLink="/blog" routerLinkActive="active" (click)="closeMenu()">Blog</a>
    </nav>
  </div>
</header>
